      # Same cell interpreter as run-gates, installed before candidate validation.
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        with:
          python-version: "3.12"
      - name: Stage trusted candidate validator
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Policy witness: checked-out commit, github.sha and workflow_sha agree.
          head="$(git rev-parse HEAD)"
          [ "$head" = "$GITHUB_SHA" ]
          [ "$head" = "$GITHUB_WORKFLOW_SHA" ]
          [ -n "$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]
          helper=scripts/ci/merge_candidate.py
          if [ -L "$helper" ] || [ ! -f "$helper" ]; then
            echo "::error::Trusted candidate validator is absent from policy commit ${head}; the candidate copy is never substituted."
            exit 1
          fi
          stage="${RUNNER_TEMP}/codex-policy"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$helper" "$stage/merge_candidate.py"
          # Stage every control file this trusted YAML executes after the
          # candidate checkout (local action, installer, pins, aggregate helper,
          # workflows). Validation refuses candidate copies that differ.
          python -I -X utf8 -B "$stage/merge_candidate.py" stage-policy "$stage"
          [ -f "$stage/manifest.json" ]
          {
            echo "CODEX_POLICY_SHA=$head"
            echo "CODEX_POLICY_BRANCH=$DEFAULT_BRANCH"
            echo "CODEX_POLICY_VALIDATOR=$stage/merge_candidate.py"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact full candidate
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_BASE_SHA: ${{ inputs.pr_base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          MERGE_TREE_SHA: ${{ inputs.merge_tree_sha }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          CANDIDATE_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$CANDIDATE_SCOPE" = "full" ]
          # The staged policy validator, never scripts/ci/merge_candidate.py from
          # the candidate workspace; -I keeps candidate paths off sys.path.
          [ -n "${CODEX_POLICY_SHA:-}" ]
          [ -n "${CODEX_POLICY_VALIDATOR:-}" ]
          [ "$GITHUB_SHA" = "$CODEX_POLICY_SHA" ]
          [ "$GITHUB_WORKFLOW_SHA" = "$CODEX_POLICY_SHA" ]
          [ ! -L "$CODEX_POLICY_VALIDATOR" ]
          [ -f "$CODEX_POLICY_VALIDATOR" ]
          [ -f "${CODEX_POLICY_VALIDATOR%/*}/manifest.json" ]
          python -I -X utf8 -B "$CODEX_POLICY_VALIDATOR" validate-dispatch
      - uses: ./.github/actions/run-gates
        with:
          python-version: "3.12"

  # Informational only. Not a dependency of linux-gates, so a regression
  # warning cannot block merge. A harness crash still fails this job.
  benchmarks:
    name: benchmarks
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
      ) &&
      github.event_name == 'pull_request' && needs.filter.outputs.run-tests == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _bench_base
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/benchmarks/requirements.txt
      - name: Install benchmark dependencies
        run: python -m pip install -r app/benchmarks/requirements.txt
      - name: Compare hot paths with the base tree
        working-directory: app
        run: |
          python -m benchmarks.compare \
            --baseline-root ../_bench_base \
            --candidate-root .. \
            --threshold 0.10 \
            --rounds 5 \
            --orderings 2 \
            --report ../bench-report.json \
            --summary ../bench-summary.md \
            --comment ../bench-comment.md \
            --clear-comment ../bench-clear.md \
            --leave ../bench-leave.md
      - name: Flag regressions on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- csl-perf-bench -->'
          mapfile -t ids < <(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id")
          existing="${ids[0]:-}"
          existing_file=""
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --jq .body > bench-existing.md
            existing_file=bench-existing.md
          fi
          body_file="$(EXISTING_FILE="$existing_file" PYTHONPATH=app python -c 'import os, sys; from pathlib import Path; from benchmarks.compare import select_comment_update; existing_path = os.environ.get("EXISTING_FILE") or ""; existing = Path(existing_path).read_text(encoding="utf-8") if existing_path else None; chosen = select_comment_update(existing, Path("bench-comment.md"), Path("bench-leave.md"), Path("bench-clear.md")); sys.stdout.write("" if chosen is None else str(chosen))')"
          if [ -z "$body_file" ]; then
            echo "Leaving the existing performance comment unchanged."
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" --raw-field body="$(cat "$body_file")"
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" --raw-field body="$(cat "$body_file")"
          fi
